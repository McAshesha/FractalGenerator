name:                FractalGenerator
version:             0.1.0.0
github:              "McAshesha/FractalGenerator"
license:             BSD-3-Clause
author:              "Ashesha"
maintainer:          "v.kovalev2@g.nsu.ru"
copyright:           "2025 Ashesha"

dependencies:
- base >= 4.7 && < 5
- terminal-size
- ansi-terminal >= 0.11
- deepseq
- parallel

ghc-options:
- -Wall

library:
  source-dirs: src

executables:
  FractalGenerator-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
      - FractalGenerator

tests:
  FractalGenerator-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - FractalGenerator
    - hspec >= 2.11
    - QuickCheck
    - silently
